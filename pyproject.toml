[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aegis-llm-gateway"
version = "0.1.0"
description = "Security and audit gateway for LLM applications: prompt-injection defense, PII pseudonymization, policy enforcement and tamper-evident audit logs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "indudhara59" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pyyaml>=6.0",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "anyio>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

ner = [
    "presidio-analyzer>=2.2.355",
    "spacy>=3.7,<4.0",
]

[project.scripts]
aegis-keygen = "gateway.cli:keygen"
aegis-secret = "gateway.cli:secret"
aegis-fpe = "gateway.cli:fpe"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "ASYNC", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["gateway"]

[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=gateway --cov-report=term-missing"
markers = ["ner: tests that need the optional Presidio/spaCy dependencies"]

[tool.coverage.run]
branch = true
source = ["gateway"]
