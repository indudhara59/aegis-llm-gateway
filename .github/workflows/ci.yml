name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check --diff .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aegis-gateway:ci .
      - name: Start container
        run: docker run -d --name aegis -p 8000:8000 -e AEGIS_APPS_FILE=config/apps.example.yaml aegis-gateway:ci
      - name: Call the gateway
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/v1/chat/completions \
            -H "Authorization: Bearer aegis_local_demo_key_do_not_use_in_production" \
            -H "Content-Type: application/json" \
            -d '{"messages":[{"role":"user","content":"ping"}]}'
      - name: Container logs
        if: always()
        run: docker logs aegis
